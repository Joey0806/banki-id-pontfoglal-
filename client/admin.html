<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemzeti Bank - Adminisztráció</title>
    <link href="client/admin.css" rel="stylesheet">
    
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div class="container">
        
        <div class="card">
            <div class="card-title">Beérkezett Időpont Foglalások</div>
            
            <div class="table-container mb-4">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Ügyfél adatai</th>
                            <th>Fiók / Szolgáltatás</th>
                            <th>Időpont</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" class="text-center text-muted py-3">Rekordok betöltése folyamatban...</td></tr>
                    </tbody>
                </table>
            </div>

           <div class="text-center">
                <button onclick="window.location.href='/idopontfoglalas'" class="btn btn-outline-light px-4 py-2 fw-semibold">
                    Kijelentkezés
                </button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "/api/appointments";

        async function loadRecords() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.length === 0 ? '<tr><td colspan="3" class="text-center text-muted py-4">Nincs tárolt rekord az adatbázisban.</td></tr>' : '';
                
                data.forEach(app => {
                    const szepDatum = app.appointmentDate.replace('T', ' ').substring(0, 16);
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${app.customerName}</b><br><small class="text-muted">${app.customerEmail}</small></td>
                            <td>${app.branchName}<br><span class="badge-service mt-1">${app.serviceType}</span></td>
                            <td class="fw-bold text-center" style="color: #2ed583;">${szepDatum}</td>
                        </tr>`;
                });
            } catch (err) { 
                console.error(err);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" class="text-center text-danger py-3">Szerver kapcsolódási hiba!</td></tr>';
            }
        }

        window.onload = loadRecords;
    </script>
</body>
</html>
