<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nemzeti Bank - Ügyfélkapu</title>
    <link href="style.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        
        <div class="bank-header-card">
            <h2>NEMZETI BANK</h2>
            <p>Online Időpontfoglalás</p>
        </div>

        
        <div id="successToast" class="success-toast">
            Belépési időpontját sikeresen rögzítettük!
        </div>

        <!-- Időpont foglaló űrlap -->
        <div class="card">
            <div class="card-title">Új Banki időpont rögzítése</div>
            <form id="bookingForm">
                <div class="form-group-row">
                    <label class="form-label">Teljes név</label>
                    <input type="text" id="customerName" class="form-control" placeholder="Pl. Kovács János" required>
                </div>
                <div class="form-group-row">
                    <label class="form-label">E-mail cím</label>
                    <input type="email" id="customerEmail" class="form-control" placeholder="Pl. janos@email.com" required>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Bankfiók / Város</label>
                    <select id="branchName" class="form-select" required>
                        <option value="Központi Fiók (Budapest)">Központi Fiók (Budapest)</option>
                        <option value="Érdi Fiók">Érdi Fiók</option>
                        <option value="Debreceni Fiók">Debreceni Fiók</option>
                        <option value="Szegedi Fiók">Szegedi Fiók</option>
                        <option value="Győri Fiók">Győri Fiók</option>
                    </select>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Ügyintézés típusa</label>
                    <select id="serviceType" class="form-select" required>
                        <option value="Számlanyitás">Számlanyitás & Kártyaügyek</option>
                        <option value="Hitelügyintézés">Hitelügyintézés & Kölcsönök</option>
                        <option value="Megtakarítás">Megtakarítás & Befektetés</option>
                        <option value="Személyi Bankár">Személyi Bankár szolgáltatás</option>
                    </select>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Dátum és időpont</label>
                    <input type="datetime-local" id="appointmentDate" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Időpont véglegesítése</button>
            </form>
        </div>

        <!-- Admin login panel -->
        <div class="card">
            <div class="card-title">Banki munkatárs Belépés</div>
            <form id="loginForm">
                <div class="form-group-row">
                    <label class="form-label">Felhasználónév</label>
                    <input type="text" id="adminUser" class="form-control" placeholder="admin" required>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Jelszó</label>
                    <input type="password" id="adminPass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="background:#384d42 !important;">Belépés és átirányítás az admin felületre</button>
            </form>
            <div id="loginError" class="text-danger text-center mt-3 fw-semibold d-none">Hibás felhatalmazási adatok!</div>
        </div>

    </div>

    <script>
        const API_URL = "/api/appointments";

        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const errorDiv = document.getElementById('loginError');

            if (user === "BankAdmin" && pass === "Bank789") {
                errorDiv.classList.add('d-none');
                window.location.href = "/admin"; // Átirányítás az adminra
            } else {
                errorDiv.classList.remove('d-none');
            }
        });

        // Új időpont rögzítés
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                branchName: document.getElementById('branchName').value,
                serviceType: document.getElementById('serviceType').value,
                appointmentDate: document.getElementById('appointmentDate').value
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (res.ok) {
                    const toast = document.getElementById('successToast');
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 3000);
                    document.getElementById('bookingForm').reset();
                } else { const r = await res.json(); alert(r.message); }
            } catch (err) { alert("Adatbázis elérés hiba."); }
        });
    </script>
</body>
</html>
