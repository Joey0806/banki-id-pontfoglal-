<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banki Időpontfoglaló - Prémium</title>
    <link href="hcilent/style.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <!-- MODERN BANKI FEJLÉC KÁRTYA -->
        <div class="bank-header-card">
            <h2>NEMZETI BANK</h2>
            <p>Digitális Ügyfélkapu & Időpontfoglalási Rendszer</p>
        </div>

        <!-- 1. KÁRTYA: IDŐPONTKÉRÉSI FELÜLET -->
        <div class="card">
            <div class="card-title">📅 Új időpont rögzítése</div>
            <form id="bookingForm">
                <div class="form-group-row">
                    <label class="form-label">Teljes név</label>
                    <input type="text" id="customerName" class="form-control" placeholder="Pl. Kovács János" required>
                </div>
                <div class="form-group-row">
                    <label class="form-label">E-mail cím</label>
                    <input type="email" id="customerEmail" class="form-control" placeholder="Pl. janos@email.com" required>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Bankfiók</label>
                    <select id="branchName" class="form-select" required>
                        <option value="Központi Fiók">Központi Fiók (Budapest)</option>
                        <option value="Érdi Fiók">Érdi Fiók</option>
                    </select>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Ügyintézés</label>
                    <select id="serviceType" class="form-select" required>
                        <option value="Számlanyitás">Számlanyitás & Kártyaügyek</option>
                        <option value="Hitelügyintézés">Hitelügyintézés & Kölcsönök</option>
                    </select>
                </div>
                <div class="form-group-row">
                    <label class="form-label">Dátum és időpont</label>
                    <input type="datetime-local" id="appointmentDate" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Időpont véglegesítése</button>
            </form>
        </div>

        <!-- 2. KÁRTYA: ADMIN FELÜLET (ÉLŐ KIOLVASÁS) -->
        <div class="card">
            <div class="card-title">🔒 Adminisztráció - Aktív foglalások</div>
            <div class="table-container">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Ügyfél adatai</th>
                            <th>Fiók / Ügyintézés</th>
                            <th>Időpont</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="3" class="text-center text-muted py-3">Adatok betöltése folyamatban...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Logika betöltése dinamikus badge kezeléssel -->
    <script>
        const API_URL = "http://localhost:5000/api/appointments";

        async function load() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.length === 0 ? '<tr><td colspan="3" class="text-center text-muted py-4">Nincs aktív foglalás a NoSQL adatbázisban.</td></tr>' : '';
                
                data.forEach(app => {
                    const szepDatum = app.appointmentDate.replace('T', ' ');
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${app.customerName}</b><br><small class="text-muted">${app.customerEmail}</small></td>
                            <td>${app.branchName}<br><span class="badge-service mt-1">${app.serviceType}</span></td>
                            <td class="fw-bold text-success">${szepDatum}</td>
                        </tr>`;
                });
            } catch (err) { console.error(err); }
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                branchName: document.getElementById('branchName').value,
                serviceType: document.getElementById('serviceType').value,
                appointmentDate: document.getElementById('appointmentDate').value
            };

            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (res.ok) {
                    alert("Sikeresen rögzítve a NoSQL adatbázisba!");
                    document.getElementById('bookingForm').reset();
                    load();
                } else { const r = await res.json(); alert(r.message); }
            } catch (err) { alert("Szerver hiba történt."); }
        });

        window.onload = load;
    </script>
</body>
</html>
