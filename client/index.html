<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Banki Időpontfoglaló</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 700px;">
        <div class="text-center my-4">
            <h2 class="text-primary fw-bold">Nemzeti Bank - Időpontfoglalás</h2>
            
        </div>

        <!-- IDŐPONTKÉRÉS -->
        <div class="card p-4 mb-4 shadow-sm border-primary">
            <h4 class="mb-3 text-primary fw-bold">📅 Új időpont rögzítése</h4>
            <form id="bookingForm">
                <div class="mb-3"><label class="form-label">Teljes név</label><input type="text" id="customerName" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">E-mail cím</label><input type="email" id="customerEmail" class="form-control" required></div>
                <div class="mb-3">
                    <label class="form-label">Bankfiók</label>
                    <select id="branchName" class="form-select" required>
                        <option value="Központi Fiók">Központi Fiók (Budapest)</option>
                        <option value="Érdi Fiók">Érdi Fiók</option>
                        <option value="Győri Fiók">Győri Fiók</option>
                        <option value="Zalai Fiók">Zalai Fiók</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ügyintézés</label>
                    <select id="serviceType" class="form-select" required>
                        <option value="Számlanyitás">Számlanyitás</option>
                        <option value="Hitelügyintézés">Hitelügyintézés</option>
                        <option value="Megtakarítás">Megtakarítás</option>
                        <option value="Személyes bankár">Személyes bankár</option>
                    </select>
                </div>
                <div class="mb-3"><label class="form-label">Dátum és időpont</label><input type="datetime-local" id="appointmentDate" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Rögzítés</button>
            </form>
        </div>

        <!-- LIVE ADMIN TÁBLÁZAT -->
        <div class="card p-4 shadow-sm border-success bg-white">
            <h4 class="mb-3 text-success fw-bold">🔒 Admin Felület - Élő kiolvasás</h4>
            <table class="table table-striped m-0">
                <thead class="table-dark">
                    <tr><th>Ügyfél</th><th>Fiók</th><th>Időpont</th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="3" class="text-center text-muted">Betöltés...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api/appointments";

        // KIOLVASÁS
        async function load() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.length === 0 ? '<tr><td colspan="3" class="text-center">Nincs aktív foglalás</td></tr>' : '';
                data.forEach(app => {
                    tbody.innerHTML += `<tr><td><b>${app.customerName}</b><br><small>${app.customerEmail}</small></td><td>${app.branchName}<br><span class="badge bg-secondary">${app.serviceType}</span></td><td class="fw-bold text-success">${app.appointmentDate.replace('T', ' ')}</td></tr>`;
                });
            } catch (err) { console.error(err); }
        }

        // RÖGZÍTÉS ÉS DINAMIKUS FRISSÍTÉS
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                branchName: document.getElementById('branchName').value,
                serviceType: document.getElementById('serviceType').value,
                appointmentDate: document.getElementById('appointmentDate').value
            };
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (res.ok) {
                    alert("Sikeresen rögzítve a NoSQL adatbázisba!");
                    document.getElementById('bookingForm').reset();
                    load(); // Azonnali frissítés újratöltés nélkül!
                } else { const r = await res.json(); alert(r.message); }
            } catch (err) { alert("Szerver hiba."); }
        });
        window.onload = load;
    </script>
</body>
</html>
