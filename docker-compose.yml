version: '3.8'

services:
  database:
    image: mongo:latest
    container_name: bank_nosql_db
    ports:
      - "4000:27017" # A Docker belső MongoDB portját kirakjuk a te Windowsod 4000-es portjára!
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bank_backend_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/bank-db
    depends_on:
      - database

  frontend:
    image: nginx:alpine
    container_name: bank_frontend
    ports:
      - "80:80"
    volumes:
      - ./client:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mongo_data: